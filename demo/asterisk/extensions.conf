; Dialplan: a call from the `caller` account to extension `hmbridge` (or the
; digit alias 100) rings the registered bridge endpoint. The bridge
; auto-answers, so the caller is connected as soon as the bridge picks up.

[from-internal]
exten => hmbridge,1,NoOp(caller -> hmbridge bridge)
 same => n,Dial(PJSIP/hmbridge,30)
 same => n,Hangup()

exten => 100,1,Goto(from-internal,hmbridge,1)
