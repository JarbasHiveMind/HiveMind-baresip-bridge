; Minimal PJSIP config for the demo PBX.
; Two accounts register here over UDP: `caller` and `hmbridge`. The dialplan
; (extensions.conf) bridges a call from `caller` to `hmbridge`, so RTP audio
; flows caller <-> Asterisk <-> bridge. Only the telephony codecs ulaw/alaw
; (PCMU/PCMA) are offered — they are what baresip and the bridge negotiate
; most reliably inside a container network.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

;=============== caller ===============
[caller]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
auth = caller-auth
aors = caller
direct_media = no

[caller-auth]
type = auth
auth_type = userpass
username = caller
password = caller-demo-pw

[caller]
type = aor
max_contacts = 1
remove_existing = yes

;=============== hmbridge ===============
[hmbridge]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
auth = hmbridge-auth
aors = hmbridge
direct_media = no

[hmbridge-auth]
type = auth
auth_type = userpass
username = hmbridge
password = hmbridge-demo-pw

[hmbridge]
type = aor
max_contacts = 1
remove_existing = yes
